<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>鯖江の食べ物 Sabae food</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,500&family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <svg width="0" height="0" style="position:absolute">
        <symbol id="ring-mark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1" />
            <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="1" />
            <circle cx="50" cy="50" r="21" fill="none" stroke="currentColor" stroke-width="1" />
            <circle cx="50" cy="50" r="7" fill="none" stroke="currentColor" stroke-width="1" />
        </symbol>
    </svg>

    <div class="grain" aria-hidden="true"></div>

    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">
            <svg class="logo-ring" id="logoRing" viewBox="0 0 100 100">
                <use href="#ring-mark"></use>
            </svg>
            <span class="logo-text">
                <span class="logo-word">Sabae</span>
                <small>CAFE & FOOD</small>
            </span>
        </a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="cafes.html" class="active">FOODS</a>
        </nav>
    </header>


    <!-- PAGE INTRO -->
    <section class="cafes-hero">

        <svg class="intro-watermark" viewBox="0 0 100 100" aria-hidden="true">
            <use href="#ring-mark"></use>
        </svg>

        <p class="section-label">SABAE FOOD GUIDE</p>

        <h1>
            鯖江の、<br>
            お気に入りのお店を。
        </h1>

        <p class="cafes-hero-text">
            鯖江市内で見つけた、居心地のいい食べ物屋や喫茶店をまとめました。
            気になるお店があれば、ぜひ訪れてみてください。
        </p>

    </section>


    <!-- SWIPE DISCOVER -->
    <section class="swipe-section">

        <p class="section-label swipe-label">SWIPE &amp; DISCOVER</p>

        <div class="swipe-strip" id="swipeStrip">
            <!-- cafes-render.js がここに写真を自動で並べます -->
        </div>

    </section>


    <!-- CAFE LIST -->
    <section class="cafes-list">

        <div class="area-filters" id="areaFilters">
            <!-- cafes-render.js がここにエリアボタンを自動で並べます -->
        </div>

        <div class="cafe-grid" id="cafeGrid">
            <!-- cafes-render.js がここに自動でカードを並べます -->
        </div>

    </section>


    <!-- DETAIL MODAL -->
    <div class="modal-overlay" id="modalOverlay">

        <div class="modal" id="modalCard">

            <button class="modal-close" id="modalClose" aria-label="閉じる">&times;</button>

            <div class="modal-image">
                <img id="modalImage" src="" alt="">
            </div>

            <div class="modal-body">

                <p class="modal-genre" id="modalGenre"></p>

                <h3 id="modalName"></h3>

                <p class="modal-comment" id="modalComment"></p>

                <div class="rating-row">
                    <span class="stars stars--light" id="modalStars"></span>
                    <span class="rating-num rating-num--light" id="modalRatingNum"></span>
                </div>

            <div class="modal-meta">
                    <p><span>ADDRESS</span><span id="modalAddress"></span></p>
                    <p><span>OPEN</span><span id="modalHours"></span></p>
                    <p><span>CLOSED</span><span id="modalClosed"></span></p>
                </div>

                <div class="modal-map">
                    <iframe
                        id="modalMapFrame"
                        src=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

            </div>

        </div>

    </div>     
    <!-- FOOTER -->
    <footer>

        <svg class="footer-ring" viewBox="0 0 100 100" aria-hidden="true">
            <use href="#ring-mark"></use>
        </svg>

        <div class="footer-logo">
            Sabae food
        </div>

        <p>
            CAFE & FOOD
        </p>

        <small>
            © 2026 Sabae food
        </small>

    </footer>


    <script src="script.js"></script>
    <script src="cafes-data.js"></script>
    <script src="cafes-render.js"></script>

</body>

</html>
