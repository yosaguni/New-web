<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>鯖江の食べ物 Sabae food</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,500&family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <svg width="0" height="0" style="position:absolute">
        <symbol id="ring-mark" viewBox="0 0 100 100">
            <circle cx="30" cy="52" r="18" fill="none" stroke="currentColor" stroke-width="1" />
            <circle cx="70" cy="52" r="18" fill="none" stroke="currentColor" stroke-width="1" />
            <path d="M48,50 Q50,44 52,50" fill="none" stroke="currentColor" stroke-width="1" />
            <path d="M12,55 L2,62" fill="none" stroke="currentColor" stroke-width="1" />
            <path d="M88,55 L98,62" fill="none" stroke="currentColor" stroke-width="1" />
        </symbol>
    </svg>

    <div class="grain" aria-hidden="true"></div>

    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">
            <svg class="logo-ring" id="logoRing" viewBox="0 0 100 100">
                <use href="#ring-mark"></use>
            </svg>
            <span class="logo-text">
                <span class="logo-word">Sabae</span>
                <small>CAFE & FOOD</small>
            </span>
        </a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="cafes.html" class="active">FOODS</a>
        </nav>
    </header>


    <!-- PAGE INTRO -->
    <section class="cafes-hero">

        <svg class="intro-watermark" viewBox="0 0 100 100" aria-hidden="true">
            <use href="#ring-mark"></use>
        </svg>

        <p class="section-label">SABAE FOOD GUIDE</p>

        <h1>
            鯖江の、<br>
            お気に入りのお店を。
        </h1>

        <p class="cafes-hero-text">
            鯖江市内で見つけた、居心地のいい食べ物屋や喫茶店をまとめました。
            気になるお店があれば、ぜひ訪れてみてください。
        </p>

    </section>


    <!-- SWIPE DISCOVER -->
    <section class="swipe-section">

        <p class="section-label swipe-label">SWIPE &amp; DISCOVER</p>

        <div class="swipe-strip" id="swipeStrip">
            <!-- cafes-render.js がここに写真を自動で並べます -->
        </div>

    </section>


    <!-- SEARCH -->
    <section class="search-section">

        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
                <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                <path d="M7.5 11h6v2.3a3 3 0 01-3 3h0a3 3 0 01-3-3V11z" fill="currentColor" />
                <path d="M13.4 11.7h0.9a1.1 1.1 0 010 2.2h-0.9" fill="none" stroke="currentColor" stroke-width="0.9" />
                <path d="M8 9c0-1 1-1 1-2s-1-1-1-2" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" />
                <path d="M10.5 9c0-1 1-1 1-2s-1-1-1-2" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" />
                <path d="M13 9c0-1 1-1 1-2s-1-1-1-2" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" />
            </svg>
            <input type="text" id="cafeSearch" class="search-input" placeholder="お店の名前で検索...">
        </div>

    </section>


    <!-- CAFE LIST -->
    <section class="cafes-list">

        <div class="area-filters" id="areaFilters">
            <!-- cafes-render.js がここにエリアボタンを自動で並べます -->
        </div>

        <div class="cafe-grid" id="cafeGrid">
            <!-- cafes-render.js がここに自動でカードを並べます -->
        </div>

    </section>


    <!-- DETAIL MODAL -->
    <div class="modal-overlay" id="modalOverlay">

        <div class="modal" id="modalCard">

            <button class="modal-close" id="modalClose" aria-label="閉じる">&times;</button>

            <button class="modal-favorite" id="modalFavorite" type="button" aria-label="お気に入り登録">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>

            <div class="modal-image">
                <img id="modalImage" src="" alt="">
            </div>

            <div class="modal-body">

                <p class="modal-genre" id="modalGenre"></p>

                <h3 id="modalName"></h3>

                <p class="modal-comment" id="modalComment"></p>

                <div class="rating-row">
                    <span class="stars stars--light" id="modalStars"></span>
                    <span class="rating-num rating-num--light" id="modalRatingNum"></span>
                </div>

            <div class="modal-meta">
                    <p><span>ADDRESS</span><span id="modalAddress"></span></p>
                    <p><span>OPEN</span><span id="modalHours"></span></p>
                    <p><span>CLOSED</span><span id="modalClosed"></span></p>
                </div>

                <div class="modal-map">
                    <iframe
                        id="modalMapFrame"
                        src=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

            </div>

        </div>

    </div>     
    <!-- FOOTER -->
    <footer>

        <svg class="footer-ring" viewBox="0 0 100 100" aria-hidden="true">
            <use href="#ring-mark"></use>
        </svg>

        <div class="footer-logo">
            Sabae food
        </div>

        <p>
            CAFE & FOOD
        </p>

        <small>
            © 2026 Sabae food
        </small>

    </footer>


    <script src="script.js"></script>
    <script src="cafes-data.js?v=5"></script>
    <script src="cafes-render.js?v=5"></script>

</body>

</html>
