<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>福井県の観光スポット</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>FUKUI SPOTS</h1>

    <nav>

        <a href="index.html"
           data-ja="ホーム"
           data-en="Home">
           ホーム
        </a>

        <a href="spots.html"
           data-ja="観光スポット"
           data-en="Tourist Spots">
           観光スポット
        </a>

        <select id="language">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>

    </nav>

</header>


<section class="spot-page">

    <h2
        data-ja="おすすめ観光スポット"
        data-en="Recommended Tourist Spots">
        おすすめ観光スポット
    </h2>


    <div class="cards">


        <!-- 恐竜博物館 -->

        <div class="card">

            <img src="kyou.jpg"
                 alt="恐竜博物館">

            <h3
                data-ja="🦖 福井県立恐竜博物館"
                data-en="🦖 Fukui Prefectural Dinosaur Museum">
                🦖 福井県立恐竜博物館
            </h3>

            <p
                data-ja="世界トップクラスの恐竜博物館です。本物の化石や大迫力の恐竜骨格を見ることができます。"
                data-en="One of the world's leading dinosaur museums. You can see real fossils and impressive dinosaur skeletons.">
                世界トップクラスの恐竜博物館です。
                本物の化石や大迫力の恐竜骨格を見ることができます。
            </p>

        </div>


        <!-- 東尋坊 -->

        <div class="card">

            <img src="tou.jpg"
                 alt="東尋坊">

            <h3
                data-ja="🌊 東尋坊"
                data-en="🌊 Tojinbo Cliffs">
                🌊 東尋坊
            </h3>

            <p
                data-ja="日本海に面した高さ約25mの断崖絶壁。夕日の景色はとても美しいです。"
                data-en="A dramatic 25-meter-high cliff overlooking the Sea of Japan. The sunset view is especially beautiful.">
                日本海に面した高さ約25mの断崖絶壁。
                夕日の景色はとても美しいです。
            </p>

        </div>


        <!-- 永平寺 -->

        <div class="card">

            <img src="ei.jpg"
                 alt="永平寺">

            <h3
                data-ja="⛩ 永平寺"
                data-en="⛩ Eiheiji Temple">
                ⛩ 永平寺
            </h3>

            <p
                data-ja="約770年の歴史を持つ禅寺。静かな雰囲気で心が落ち着きます。"
                data-en="A Zen temple with about 770 years of history. Its peaceful atmosphere is perfect for relaxing your mind.">
                約770年の歴史を持つ禅寺。
                静かな雰囲気で心が落ち着きます。
            </p>

        </div>


        <!-- 越前がに -->

        <div class="card">

            <img src="kani.jpg"
                 alt="越前がに">

            <h3
                data-ja="🦀 越前がに"
                data-en="🦀 Echizen Crab">
                🦀 越前がに
            </h3>

            <p
                data-ja="福井県を代表する冬の味覚。全国的にも人気のブランドガニです。"
                data-en="A famous winter delicacy of Fukui. Echizen Crab is a highly popular premium crab in Japan.">
                福井県を代表する冬の味覚。
                全国的にも人気のブランドガニです。
            </p>

        </div>


    </div>

</section>


<footer>

    <p
        data-ja="© 2026 Discover FUKUI"
        data-en="© 2026 Discover FUKUI">
        © 2026 Discover FUKUI
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
